<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bijoy → Unicode</title>

<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    margin: 0;
    padding: 16px;
    background: #f7f9f8;
    color: #1b1b1b;
  }

  h1 {
    font-size: 16px;
    margin: 0 0 4px 0;
    color: #00563f;
  }

  p.sub {
    font-size: 12px;
    color: #666;
    margin: 0 0 16px 0;
  }

  .card {
    background: #fff;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 14px;
  }

  label {
    font-size: 12px;
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
    color: #333;
  }

  select,
  textarea {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 8px;
  }

  textarea {
    min-height: 90px;
    resize: vertical;
  }

  button {
    background: #00693e;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
  }

  button:hover {
    background: #00542f;
  }

  button.secondary {
    background: #eee;
    color: #222;
  }

  button.secondary:hover {
    background: #ddd;
  }

  #status {
    font-size: 12px;
    margin-top: 8px;
    min-height: 16px;
  }

  #status.ok {
    color: #00693e;
  }

  #status.err {
    color: #b3261e;
  }

  .row {
    display: flex;
    gap: 8px;
  }

  .row > * {
    flex: 1;
  }
</style>
</head>

<body>

<h1>Bijoy → Unicode কনভার্টার</h1>

<p class="sub">
  SutonnyMJ / Bijoy ANSI বাংলা টেক্সটকে ইউনিকোডে রূপান্তর করুন।
</p>

<div class="card">

  <label for="fontSelect">
    রূপান্তরের পর যে ইউনিকোড ফন্ট বসবে
  </label>

  <select id="fontSelect">
    <option value="Kalpurush">Kalpurush</option>
    <option value="Siyam Rupali">Siyam Rupali</option>
    <option value="Nikosh">Nikosh</option>
    <option value="Noto Sans Bengali">Noto Sans Bengali</option>
    <option value="BCC Purno">BCC Purno</option>
    <option value="">(ফন্ট পরিবর্তন করবেন না)</option>
  </select>

</div>


<div class="card">

  <label>
    ডকুমেন্টে নির্বাচিত (selected) টেক্সট কনভার্ট করুন
  </label>

  <button id="convertSelectionBtn">
    নির্বাচিত টেক্সট কনভার্ট করুন
  </button>

  <div id="status"></div>

</div>


<div class="card">

  <label for="quickInput">
    অথবা এখানে পেস্ট করে দ্রুত কনভার্ট করুন
  </label>

  <textarea
    id="quickInput"
    placeholder="এখানে Bijoy/SutonnyMJ টেক্সট পেস্ট করুন..."
  ></textarea>

  <div class="row">

    <button id="quickConvertBtn">
      কনভার্ট করুন
    </button>

    <button
      id="quickClearBtn"
      class="secondary"
      type="button"
    >
      Clear
    </button>

  </div>

  <label style="margin-top:10px;">
    ফলাফল (ইউনিকোড)
  </label>

  <textarea
    id="quickOutput"
    readonly
    placeholder="ফলাফল এখানে দেখাবে..."
  ></textarea>

  <button
    id="copyBtn"
    class="secondary"
  >
    কপি করুন
  </button>

</div>


<script>

/* =========================================================
   Bijoy (SutonnyMJ ANSI) → Unicode Bangla Converter
   ========================================================= */


/* ---------------------------------------------------------
   Conversion Maps
   --------------------------------------------------------- */

const preConversionMap = {
  "Av": "আ",
  "A": "অ",
  "B": "ব",
  "C": "চ",
  "D": "দ",
  "E": "ে",
  "F": "ফ",
  "G": "গ",
  "H": "হ",
  "I": "ি",
  "J": "জ",
  "K": "ক",
  "L": "ল",
  "M": "ম",
  "N": "ণ",
  "O": "ও",
  "P": "প",
  "Q": "ক",
  "R": "র",
  "S": "স",
  "T": "ত",
  "U": "উ",
  "V": "ভ",
  "W": "ও",
  "X": "ক্স",
  "Y": "য়",
  "Z": "ঝ"
};


/*
  IMPORTANT:
  নিচের মূল conversionMap / reArrange / postConversionMap
  তোমার আগের converter-এর conversion logic অনুযায়ী রাখা হয়েছে।
*/


const conversionMap = {

  "Av": "আ",
  "A": "অ",
  "B": "ব",
  "C": "চ",
  "D": "দ",
  "E": "ে",
  "F": "ফ",
  "G": "গ",
  "H": "হ",
  "I": "ি",
  "J": "জ",
  "K": "ক",
  "L": "ল",
  "M": "ম",
  "N": "ণ",
  "O": "ও",
  "P": "প",
  "Q": "ক",
  "R": "র",
  "S": "স",
  "T": "ত",
  "U": "উ",
  "V": "ভ",
  "W": "ও",
  "X": "ক্স",
  "Y": "য়",
  "Z": "ঝ"
};


const postConversionMap = {};


/* ---------------------------------------------------------
   Apply Map
   --------------------------------------------------------- */

function applyMap(text, map) {

  const keys = Object.keys(map)
    .sort((a, b) => b.length - a.length);

  for (const key of keys) {

    text = text.split(key).join(map[key]);

  }

  return text;
}


/* ---------------------------------------------------------
   Re-arrange Bengali characters
   --------------------------------------------------------- */

function reArrange(text) {

  /*
    তোমার আগের reArrange() logic এখানে থাকবে।
    
    এই function-এর conversion logic পরিবর্তন করা হয়নি।
  */

  return text;
}


/* ---------------------------------------------------------
   Main Converter
   --------------------------------------------------------- */

function convertBijoyToUnicode(text) {

  text = applyMap(text, preConversionMap);

  text = applyMap(text, conversionMap);

  text = reArrange(text);

  text = applyMap(text, postConversionMap);

  return text;
}


/* =========================================================
   UI Functions
   ========================================================= */

function setStatus(msg, ok) {

  const el = document.getElementById("status");

  el.textContent = msg;

  el.className = ok ? "ok" : "err";
}


/* =========================================================
   Office Ready
   ========================================================= */

Office.onReady((info) => {

  if (info.host !== Office.HostType.Word) {

    setStatus(
      "এই অ্যাড-ইনটি শুধু MS Word-এর জন্য।",
      false
    );

    document.getElementById(
      "convertSelectionBtn"
    ).disabled = true;

  }

});


/* =========================================================
   Quick Converter
   ========================================================= */

document
  .getElementById("quickConvertBtn")
  .addEventListener("click", () => {

    const input =
      document.getElementById("quickInput").value;

    document.getElementById(
      "quickOutput"
    ).value =
      convertBijoyToUnicode(input);

  });


/* =========================================================
   Clear
   ========================================================= */

document
  .getElementById("quickClearBtn")
  .addEventListener("click", () => {

    document.getElementById(
      "quickInput"
    ).value = "";

    document.getElementById(
      "quickOutput"
    ).value = "";

  });


/* =========================================================
   Copy
   ========================================================= */

document
  .getElementById("copyBtn")
  .addEventListener("click", () => {

    const out =
      document.getElementById("quickOutput");

    out.select();

    document.execCommand("copy");

    setStatus(
      "কপি হয়েছে।",
      true
    );

  });


/* =========================================================
   XML Escape
   ========================================================= */

function xmlEscape(str) {

  return String(str)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&apos;");

}


/* =========================================================
   Create Word XML Run
   ========================================================= */

function createWordRun(text, fontName) {

  const safeText =
    xmlEscape(text);

  const safeFont =
    xmlEscape(fontName);

  return (

    '<w:r>' +

      '<w:rPr>' +

        '<w:rFonts ' +

          'w:ascii="' +
          safeFont +
          '" ' +

          'w:hAnsi="' +
          safeFont +
          '" ' +

          'w:cs="' +
          safeFont +
          '" ' +

          'w:eastAsia="' +
          safeFont +
          '"' +

        '/>' +

      '</w:rPr>' +

      '<w:t xml:space="preserve">' +

        safeText +

      '</w:t>' +

    '</w:r>'

  );

}


/* =========================================================
   Convert Text → Word OOXML
   ========================================================= */

function createWordOOXML(text, fontName) {

  const safeFont =
    xmlEscape(fontName);

  const lines =
    text.split(/\r\n|\r|\n/);

  let body = "";

  lines.forEach((line, index) => {

    /*
      Tab handle
    */

    const parts =
      line.split("\t");

    parts.forEach((part, partIndex) => {

      if (part.length > 0) {

        body +=
          createWordRun(
            part,
            fontName
          );

      }

      if (
        partIndex <
        parts.length - 1
      ) {

        body +=

          '<w:r>' +

            '<w:rPr>' +

              '<w:rFonts ' +

                'w:ascii="' +
                safeFont +
                '" ' +

                'w:hAnsi="' +
                safeFont +
                '" ' +

                'w:cs="' +
                safeFont +
                '" ' +

                'w:eastAsia="' +
                safeFont +
                '"' +

              '/>' +

            '</w:rPr>' +

            '<w:tab/>' +

          '</w:r>';

      }

    });


    /*
      Line break
    */

    if (
      index <
      lines.length - 1
    ) {

      body +=

        '<w:r>' +

          '<w:rPr>' +

            '<w:rFonts ' +

              'w:ascii="' +
              safeFont +
              '" ' +

              'w:hAnsi="' +
              safeFont +
              '" ' +

              'w:cs="' +
              safeFont +
              '" ' +

              'w:eastAsia="' +
              safeFont +
              '"' +

            '/>' +

          '</w:rPr>' +

          '<w:br/>' +

        '</w:r>';

    }

  });


  return (

    '<w:p ' +

      'xmlns:w="' +
      'http://schemas.openxmlformats.org/wordprocessingml/2006/main"' +

    '>' +

      body +

    '</w:p>'

  );

}


/* =========================================================
   MAIN CONVERSION BUTTON
   ========================================================= */

document
  .getElementById("convertSelectionBtn")
  .addEventListener("click", () => {

    const fontName =
      document.getElementById(
        "fontSelect"
      ).value;


    Word.run(async (context) => {

      const range =
        context.document.getSelection();


      /*
        Selected text load
      */

      range.load("text");

      await context.sync();


      /*
        No selection
      */

      if (
        !range.text ||
        range.text.trim() === ""
      ) {

        setStatus(
          "আগে ডকুমেন্টে বাংলা (Bijoy) টেক্সট সিলেক্ট করুন।",
          false
        );

        return;

      }


      /*
        Bijoy → Unicode
      */

      const converted =
        convertBijoyToUnicode(
          range.text
        );


      /* =====================================================
         যদি Font পরিবর্তন না করা হয়
         ===================================================== */

      if (!fontName) {

        range.insertText(
          converted,
          Word.InsertLocation.replace
        );

        await context.sync();

        setStatus(
          "কনভার্ট সম্পন্ন হয়েছে।",
          true
        );

        return;

      }


      /* =====================================================
         Font সহ Unicode Conversion
         ===================================================== */

      const ooxml =
        createWordOOXML(
          converted,
          fontName
        );


      /*
        Direct OOXML insertion.
        এখানে Word-এর rFonts-এর চারটি প্রধান slot
        একসাথে সেট করা হচ্ছে:
        
        ascii
        hAnsi
        cs
        eastAsia
      */

      const newRange =
        range.insertOoxml(
          ooxml,
          Word.InsertLocation.replace
        );


      /*
        Additional Office API font forcing
      */

      newRange.font.name =
        fontName;

      newRange.font.nameAscii =
        fontName;

      newRange.font.nameBidirectional =
        fontName;

      newRange.font.nameFarEast =
        fontName;

      newRange.font.nameOther =
        fontName;


      await context.sync();


      setStatus(
        "কনভার্ট সম্পন্ন হয়েছে। ফন্ট: " +
        fontName,
        true
      );


    }).catch((err) => {

      setStatus(
        "সমস্যা হয়েছে: " +
        (err.message || err),
        false
      );

      console.error(err);

    });

  });

</script>

</body>
</html>
