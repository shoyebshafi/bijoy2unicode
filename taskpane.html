<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Bijoy → Unicode</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Kalpurush","Siyam Rupali","Nirmala UI","Segoe UI",sans-serif; margin:0; padding:16px; background:#f7f9f8; color:#1b1b1b; }
  h1 { font-size:16px; margin:0 0 4px; color:#00563f; }
  p.sub { font-size:12px; color:#666; margin:0 0 16px; }
  .card { background:#fff; border:1px solid #e2e2e2; border-radius:8px; padding:12px; margin-bottom:14px; }
  label { font-size:12px; font-weight:600; display:block; margin-bottom:6px; color:#333; }
  select, textarea { width:100%; font-family:inherit; font-size:14px; border:1px solid #ccc; border-radius:6px; padding:8px; }
  textarea { min-height:90px; resize:vertical; }
  button { background:#00693e; color:#fff; border:none; border-radius:6px; padding:10px 14px; font-size:13px; font-weight:600; cursor:pointer; width:100%; margin-top:8px; font-family:inherit; }
  button:hover { background:#00542f; }
  button.secondary { background:#eee; color:#222; }
  button.secondary:hover { background:#ddd; }
  #status { font-size:12px; margin-top:8px; min-height:16px; }
  #status.ok { color:#00693e; } #status.err { color:#b3261e; } #status.info { color:#666; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
</style>
</head>
<body>

  <h1>Bijoy → Unicode কনভার্টার</h1>
  <p class="sub"> <b id="ver" style="color:#EE0000">Qaari Tech: v17</b></p>

  <div class="card">
    <label for="fontSelect">ফন্ট নির্বাচন করুন</label>
    <select id="fontSelect">
      <option value="BCC Purno">BCC Purno</option>
      <option value="Kalpurush">Kalpurush</option>
      <option value="Siyam Rupali">Siyam Rupali</option>
      <option value="Nikosh">Nikosh</option>
      <option value="Noto Sans Bengali">Noto Sans Bengali</option>
      <option value="">(ফন্ট পরিবর্তন করবেন না)</option>
    </select>
  </div>

  <div class="card">
    <label>ডকুমেন্টে সিলেক্ট করা টেক্সট কনভার্ট করুন</label>
    <label style="font-weight:400; display:flex; gap:6px; align-items:flex-start; margin-bottom:0;">
      <input type="checkbox" id="onlyBijoy" checked style="margin-top:3px;">
      <span>শুধু Bijoy ফন্ট কনভার্ট হবে; ইংরেজি/অন্য ফন্ট অপরিবর্তিত থাকবে</span>
    </label>
    <input id="extraFonts" placeholder="অতিরিক্ত Bijoy ফন্টের নাম (কমা দিয়ে), যেমন: SiyamRupali_ANSI" style="width:100%;margin-top:8px;padding:6px;border:1px solid #ccc;border-radius:6px;font-size:12px;font-family:inherit;">
    <button id="convertSelectionBtn">সিলেক্ট করা টেক্সট কনভার্ট করুন</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <label for="quickInput">অথবা এখানে পেস্ট করে দ্রুত কনভার্ট করুন</label>
    <textarea id="quickInput" placeholder="এখানে Bijoy/SutonnyMJ টেক্সট পেস্ট করুন..."></textarea>
    <div class="row">
      <button id="quickConvertBtn">কনভার্ট করুন</button>
      <button id="quickClearBtn" class="secondary" type="button">Clear</button>
    </div>
    <label style="margin-top:10px;">ফলাফল (ইউনিকোড)</label>
    <textarea id="quickOutput" readonly placeholder="ফলাফল এখানে দেখাবে..."></textarea>
    <button id="copyBtn" class="secondary">কপি করুন</button>
  </div>

<script>
// ==CONVERTER-START==
const REPH = '\uE000'; // Bijoy-এর © (রেফ) — পরে সঠিক জায়গায় বসানো হয়

// একক অক্ষর → ইউনিকোড
const MAP = {};
(function () {
  const keys = 'KLMNOPQRSTUVWXYZ_`abcdefghijklmnopqrstu';
  const vals = ['ক','খ','গ','ঘ','ঙ','চ','ছ','জ','ঝ','ঞ','ট','ঠ','ড','ঢ','ণ','ত',
                'থ','দ','ধ','ন','প','ফ','ব','ভ','ম','য','র','ল','শ','ষ','স','হ',
                'ড়','ঢ়','য়','ৎ','ং','ঃ','ঁ'];
  for (let i = 0; i < keys.length; i++) MAP[keys[i]] = vals[i];

  const vow = 'ABCDEFGHIJ', vv = ['অ','ই','ঈ','উ','ঊ','ঋ','এ','ঐ','ও','ঔ'];
  // A = অ, Av = আ (নিচে আলাদাভাবে সামলানো হয়েছে)
  MAP['A'] = 'অ';
  for (let i = 1; i < vow.length; i++) MAP[vow[i]] = vv[i];
  '০১২৩৪৫৬৭৮৯'.split('').forEach((d, i) => MAP[String(i)] = d);

  Object.assign(MAP, {
    // কার
    'v':'া','w':'ি','x':'ী','y':'ু','z':'ু','~':'ূ','ƒ':'ূ','‚':'ূ',
    '„':'ৃ','…':'ৃ','†':'ে','‡':'ে','ˆ':'ৈ','‰':'ৈ','Š':'ৗ',
    // বিরাম
    '|':'।','&':'্‌',
    // ফলা ও অর্ধ-বর্ণ
    'Ö':'্র','ª':'্র','«':'্র','¨':'্য','¬':'্ল','\u00AD':'্ল',
    'Ÿ':'্ব','¡':'্ব','¦':'্ব','^':'্ব','œ':'্ন','¥':'্ম','§':'্ম',
    '¢':'্ভ','£':'্ভ্র','—':'্ত','’':'থ',
    '¯':'স্','®':'ষ্','š':'ন্','›':'ন্','˜':'দ্','™':'দ্','¤':'ম্','”':'চ্','•':'ঙ্',
    'ú':'প',
    // যুক্তবর্ণ
    '‘':'তু','‹':'্ক','Œ':'্ক্র',
    '°':'ক্ক','±':'ক্ট','²':'ক্ষ্ণ','³':'ক্ত','´':'ক্ম','µ':'ক্র','¶':'ক্ষ','ÿ':'ক্ষ','·':'ক্স',
    '¸':'গু','¹':'জ্ঞ','º':'গ্দ','»':'গ্ধ','¼':'ঙ্ক','½':'ঙ্গ','¾':'জ্জ','¿':'্ত্র',
    'À':'জ্ঝ','Á':'জ্ঞ','Â':'ঞ্চ','Ã':'ঞ্ছ','Ä':'ঞ্জ','Å':'ঞ্ঝ','Æ':'ট্ট','Ç':'ড্ড',
    'È':'ণ্ট','É':'ণ্ঠ','Ê':'ণ্ড','Ë':'ত্ত','Ì':'ত্থ','Í':'ত','Î':'ত্র','Ï':'দ্দ',
    '×':'দ্ধ','Ø':'দ্ব','Ù':'দ্ম','Ú':'ন্ঠ','Û':'ন্ড','Ü':'ন্ধ','Ý':'ন্স',
    'Þ':'প্ট','ß':'প্ত','à':'প্প','á':'প্স','â':'ব্জ','ã':'ব্দ','ä':'ব্ধ','å':'ভ্র',
    'æ':'ু','ç':'ম্ফ','è':'্ন','é':'ল্ক','ê':'ল্গ','ë':'ল্ট','ì':'ল্ড','í':'ল্প','î':'ল্ফ',
    'ï':'শু','ð':'শ্চ','ñ':'শ্ছ','ò':'ষ্ণ','ó':'ষ্ট','ô':'ষ্ঠ','õ':'ষ্ফ',
    'ö':'স্খ','÷':'স্ট','ø':'্ল','ù':'স্ফ','û':'হু','ü':'হৃ','ý':'হ্ন','þ':'হ্ম',
    // যতিচিহ্ন
    'Ð':'ণ্ড','Ñ':'-','Ò':'"','Ó':'"','Ô':"'",'Õ':"'"
  });
  MAP['©'] = REPH;
})();

// ব্যঞ্জন (+ নুক্তা) এবং যুক্তাক্ষর ক্লাস্টার
const C  = '[\u0995-\u09B9]\u09BC?';
const CL = C + '(?:\u09CD' + C + ')*';

function convertBijoyToUnicode(input) {
  let s = input.replace(/\u00A0/g, ' ');

  // ১) অক্ষর-ভিত্তিক ম্যাপিং (Av → আ)
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === 'A' && s[i + 1] === 'v') { out += 'আ'; i++; continue; }
    out += (ch in MAP) ? MAP[ch] : ch;
  }
  s = out;

  // ২) ড় ঢ় য় → বিয়োজিত রূপ (ড + ়) যাতে ক্লাস্টার ঠিকমতো ধরা যায়
  s = s.replace(/\u09DC/g, '\u09A1\u09BC')
       .replace(/\u09DD/g, '\u09A2\u09BC')
       .replace(/\u09DF/g, '\u09AF\u09BC');

  // ৩) দ্বিগুণ হসন্ত ঠিক করা
  s = s.replace(/\u09CD\u09CD+/g, '\u09CD');

  // কার (া ী ু ূ ৃ ৗ ঁ) যদি ফলা/যুক্তের (্য ্র ...) আগে বসে, ফলা আগে আনা: দ+ু+্য → দ্যু
  for (let k = 0; k < 4; k++) {
    const t = s.replace(/([\u09BE\u09C0-\u09C3\u09D7\u0981])(\u09CD[\u0995-\u09B9]\u09BC?)/g, '$2$1');
    if (t === s) break;
    s = t;
  }

  // ৪) রেফ: ব্যঞ্জন-ক্লাস্টারের আগে র্ বসানো
  // ব্যঞ্জন ও রেফের মাঝে া ী ু ূ ৃ ৗ কার থাকতে পারে (যেমন কর্তৃক = KZ…©K)
  s = s.replace(new RegExp('(' + CL + ')([\u09BE\u09C0-\u09C3\u09D7]*)' + REPH, 'g'), 'র\u09CD$1$2');

  // ৫) ি ে ৈ কার — ক্লাস্টারের পরে বসানো
  s = s.replace(new RegExp('([\u09BF\u09C7\u09C8])(' + CL + ')', 'g'), '$2$1');

  // ৬) ো ও ৌ গঠন
  s = s.replace(/\u09C7\u09BE/g, '\u09CB').replace(/\u09C7\u09D7/g, '\u09CC');

  // ৭) চন্দ্রবিন্দু + কার → কার + চন্দ্রবিন্দু
  s = s.replace(/\u0981([\u09BE\u09BF\u09C0\u09C1\u09C2\u09C3\u09CB\u09CC])/g, '$1\u0981');

  // ৮) বিবিধ পরিষ্কার
  s = s.replace(/অ\u09BE/g, 'আ')
       .replace(/([০-৯])ঃ/g, '$1:')
       .replace(/([ \]\[])ঃ/g, '$1:')
       .replace(/\u09CD\u200C\u09CD\u200C/g, '\u09CD\u200C');
  return s;
}

// ==CONVERTER-END==

function setStatus(msg, kind) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = kind || '';
}

let isWord = false;
if (typeof Office !== 'undefined' && Office.onReady) {
  Office.onReady((info) => {
    isWord = info && info.host === Office.HostType.Word;
    if (!isWord) {
      setStatus('MS Word-এর Add in এর জন্য। নিচের পেস্ট বক্স ব্রাউজারেও কাজ করে।', 'info');
      document.getElementById('convertSelectionBtn').disabled = true;
    }
  });
} else {
  setStatus('ডকুমেন্ট থেকে কনভার্ট শুধু MS Word-এ কাজ করবে। নিচের পেস্ট বক্স ব্রাউজারেও কাজ করে।', 'info');
  document.getElementById('convertSelectionBtn').disabled = true;
}

document.getElementById('quickConvertBtn').addEventListener('click', () => {
  document.getElementById('quickOutput').value =
    convertBijoyToUnicode(document.getElementById('quickInput').value);
});

document.getElementById('quickClearBtn').addEventListener('click', () => {
  document.getElementById('quickInput').value = '';
  document.getElementById('quickOutput').value = '';
});

document.getElementById('copyBtn').addEventListener('click', async () => {
  const out = document.getElementById('quickOutput');
  try {
    await navigator.clipboard.writeText(out.value);
  } catch (e) {
    out.select();
    document.execCommand('copy');
  }
  setStatus('কপি হয়েছে।', 'ok');
});

function isBijoyFont(name) {
  const n = name.toLowerCase().replace(/\s+/g, '');
  if (/MJ/.test(name) || /bijoy|sutonny|ansi|adorsho|adarsha/.test(n)) return true;
  const extra = (document.getElementById('extraFonts').value || '')
    .split(',').map((x) => x.trim().toLowerCase().replace(/\s+/g, '')).filter(Boolean);
  return extra.includes(n);
}

const hasBengali = /[\u0980-\u09FF]/;
const GLYPH = /[‡†›¨©ÿ¯ª«š˜™¤¥§œ¶]/;                 // শুধু Bijoy-তে আসে, ইংরেজিতে নয়
const LATIN_OR_GLYPH = /[A-Za-z‡†›¨©ÿ¯ª«š˜™¤¥§œ¶]/;
const norm = (t) => t.replace(/\s+/g, ' ').trim();
let slotsCache = null;
const csOk = {}; // কোন complex-script বৈশিষ্ট্য (boldBidirectional ইত্যাদি) এই Word-এ চলে

// মিশ্র ফন্টের শব্দ ([GLv‡b, e¨vmva©], {eq \f(a,b)} ইত্যাদি): চিহ্ন দিয়ে ভেঙে প্রতিটি অংশ আলাদা করে খোঁজা
const DELIM = /[\\\[\](){}<>,;:=+\/*%#@"'!?.\-]+/;
function queueMixed(list) {
  const items = [];
  for (const w of list) {
    // ফিল্ড-কোডের কিওয়ার্ড (eq, \f, \s \up6 ...) কখনো কনভার্ট হবে না
    const protect = new Set();
    if (/[{\\]/.test(w.text)) {
      protect.add('eq');
      (w.text.match(/\\[A-Za-z]+\d*/g) || []).forEach((m) => protect.add(m.slice(1)));
    }
    // Bijoy-অক্ষর (MAP-এ থাকা) ছাড়া যেকোনো চিহ্ন (।  /  –  ( ) , ইত্যাদি) টুকরো আলাদা করে
    const raw = [];
    let curTok = '';
    for (const ch of w.text) {
      if (ch in MAP) curTok += ch;
      else { if (curTok) raw.push(curTok); curTok = ''; }
    }
    if (curTok) raw.push(curTok);
    const toks = [...new Set(raw)].filter((t) => !protect.has(t));
    if (!toks.length || (toks.length === 1 && toks[0] === w.text)) continue;
    const ms = toks.map((t) => {
      const m = w.search(t.replace(/\^/g, '^^'), { matchCase: true });
      m.load('items/text,items/font/name,items/font/bold,items/font/italic,items/font/size');
      return { t, m };
    });
    items.push({ w, ms });
  }
  return items;
}
function finishMixed(items) {
  const map = new Map();
  for (const it of items) {
    const arr = [];
    for (const { t, m } of it.ms) {
      m.items.forEach((x) => {
        if (x.text !== t || !isBijoyFont(x.font.name || '')) return; // শুধু Bijoy ফন্টের অংশ
        const conv = convertBijoyToUnicode(t);
        if (conv !== t) arr.push({ range: x, orig: t, conv, fn: x.font.name, n: 1, fmt: { bold: x.font.bold, italic: x.font.italic, size: x.font.size } });
      });
    }
    if (arr.length) map.set(it.w, arr);
  }
  return map;
}

// টুকরোগুলো একবারে বদলানো + ফন্ট + একবার যাচাই + শুধু ব্যর্থগুলোর জন্য একটি পুনরায় চেষ্টা
async function applyJobs(context, targets, fontName) {
  const res = { converted: 0, healed: 0, failed: [], words: 0 };
  if (!targets.length) return res;

  if (fontName && slotsCache === null) {
    slotsCache = [];
    for (const p of ['nameBidirectional', 'nameBi', 'nameAscii', 'nameOther', 'nameFarEast']) {
      try { targets[0].range.font[p] = fontName; await context.sync(); slotsCache.push(p); } catch (e) { /* নেই */ }
    }
  }
  const applyFont = (r) => {
    r.font.name = fontName;
    (slotsCache || []).forEach((p) => { r.font[p] = fontName; });
  };

  // বাংলা অক্ষর Word-এ complex script, তাই তার বোল্ড/ইটালিক/সাইজ আলাদা (Bidirectional) থাকে।
  // মূল Bijoy লেখার বোল্ড/ইটালিক/সাইজ হুবহু বসানো হয়, যাতে কনভার্টের পর হঠাৎ বোল্ড না দেখায়।
  for (const [p, key] of [['boldBidirectional', 'bold'], ['italicBidirectional', 'italic'], ['sizeBidirectional', 'size']]) {
    if (csOk[p] !== undefined) continue;
    const t = targets.find((j) => j.fmt && j.fmt[key] !== null && j.fmt[key] !== undefined);
    if (!t) continue;
    try { t.range.font[p] = t.fmt[key]; await context.sync(); csOk[p] = true; } catch (e) { csOk[p] = false; }
  }
  const applyFmt = (r, fmt) => {
    if (!fmt) return;
    if (fmt.bold === true || fmt.bold === false) { r.font.bold = fmt.bold; if (csOk.boldBidirectional) r.font.boldBidirectional = fmt.bold; }
    if (fmt.italic === true || fmt.italic === false) { r.font.italic = fmt.italic; if (csOk.italicBidirectional) r.font.italicBidirectional = fmt.italic; }
    if (typeof fmt.size === 'number' && fmt.size > 0 && csOk.sizeBidirectional) r.font.sizeBidirectional = fmt.size;
  };

  targets.reverse(); // শেষ থেকে শুরুর দিকে
  const rs = targets.map((j) => {
    const r = j.range.insertText(j.conv, Word.InsertLocation.replace);
    applyFmt(r, j.fmt);
    if (fontName) applyFont(r);
    r.load('text');
    return r;
  });
  await context.sync();

  const bad = [];
  for (let i = 0; i < targets.length; i++) {
    if (norm(rs[i].text) !== norm(targets[i].conv)) bad.push(i);
  }
  res.converted = targets.length - bad.length;
  res.words = targets.reduce((a, j) => a + j.n, 0);

  if (bad.length) {
    const rs2 = bad.map((i) => {
      const r = targets[i].range.insertText(targets[i].conv, Word.InsertLocation.replace);
      applyFmt(r, targets[i].fmt);
      if (fontName) applyFont(r);
      r.load('text');
      return r;
    });
    try { await context.sync(); } catch (e) { /* নিচে ব্যর্থ ধরা হবে */ }
    const failedIdx = [];
    bad.forEach((i, k) => {
      let ok = false;
      try { ok = norm(rs2[k].text) === norm(targets[i].conv); } catch (e) {}
      if (ok) { res.healed++; res.converted++; } else { failedIdx.push(i); }
    });
    if (failedIdx.length) {
      failedIdx.forEach((i) => { if (targets[i].fn) targets[i].range.font.name = targets[i].fn; });
      try { await context.sync(); } catch (e) {}
      res.failed = failedIdx.map((i) => targets[i].orig.slice(0, 30));
    }
  }
  return res;
}

document.getElementById('convertSelectionBtn').addEventListener('click', () => {
  const fontName = document.getElementById('fontSelect').value;
  const onlyBijoy = document.getElementById('onlyBijoy').checked;
  const btn = document.getElementById('convertSelectionBtn');
  btn.disabled = true;
  setStatus('চলছে…', 'info');

  Word.run(async (context) => {
    const sel = context.document.getSelection();
    context.trackedObjects.add(sel); // ধাপগুলোর মাঝে সিলেকশন সরে গেলেও ঠিক থাকবে

    const paras = sel.paragraphs;
    paras.load('items');
    await context.sync();

    // ধাপ ১: অনুচ্ছেদ ধরে, পাশাপাশি Bijoy শব্দ জুড়ে একটি টুকরো
    const cols = paras.items.map((p) => {
      const c = p.getRange('Whole').intersectWith(sel).getTextRanges([' '], true);
      c.load('items/text,items/font/name,items/font/bold,items/font/italic,items/font/size,items/font/color,items/font/underline');
      return c;
    });
    await context.sync();

    let skipped = 0, mixed = 0;
    const skipFonts = {}, mixedSamples = [], segs = [], order = [], mixedList = [];
    for (const col of cols) {
      let cur = null;
      for (const w of col.items) {
        if (!w.text || !w.text.trim()) continue;
        const fn = w.font.name || '';
        if (onlyBijoy) {
          if (fn === '') { mixed++; mixedList.push(w); order.push({ mixedWord: w }); if (mixedSamples.length < 6) mixedSamples.push(w.text); cur = null; continue; }
          if (!isBijoyFont(fn)) { skipped++; skipFonts[fn] = (skipFonts[fn] || 0) + 1; cur = null; continue; }
        }
        const key = [fn, w.font.bold, w.font.italic, w.font.size, w.font.color, w.font.underline].join('|');
        if (!cur || cur.key !== key) { cur = { words: [], fn, key, fmt: { bold: w.font.bold, italic: w.font.italic, size: w.font.size } }; segs.push(cur); order.push({ seg: cur }); }
        cur.words.push(w);
      }
    }

    segs.forEach((g) => {
      g.range = g.words.length > 1 ? g.words[0].expandTo(g.words[g.words.length - 1]) : g.words[0];
      g.range.load('text');
    });
    const mixedItems = queueMixed(mixedList);
    await context.sync();
    const mixedMap = finishMixed(mixedItems);

    // কাজের তালিকা ডকুমেন্টের ক্রমে (টুকরো ও মিশ্র-শব্দের অংশ একসাথে)
    const jobs = [];
    for (const o of order) {
      if (o.mixedWord) {
        if (mixedMap.has(o.mixedWord)) mixedMap.get(o.mixedWord).forEach((j) => jobs.push(j));
        continue;
      }
      const g = o.seg;
      const single = g.words.length === 1;
      if (single || norm(g.range.text) === norm(g.words.map((w) => w.text).join(' '))) {
        jobs.push({ range: g.range, orig: single ? g.words[0].text : g.range.text, fn: g.fn, n: g.words.length, fmt: g.fmt });
      } else {
        g.words.forEach((w) => jobs.push({ range: w, orig: w.text, fn: g.fn, n: 1, fmt: g.fmt }));
      }
    }
    jobs.forEach((j) => { if (j.conv === undefined) j.conv = convertBijoyToUnicode(j.orig); });
    const r1 = await applyJobs(context, jobs.filter((j) => j.conv !== j.orig), fontName);

    // যাচাই: কোনো অনুচ্ছেদে এখনো Bijoy-চিহ্ন (‡ † ¨ © ইত্যাদি) আছে কিনা
    const leftoverParas = async () => {
      const ps = sel.paragraphs;
      ps.load('items/text');
      await context.sync();
      return ps.items.map((p) => p.text).filter((t) => GLYPH.test(t));
    };
    let left = await leftoverParas();

    // ধাপ ২ (শুধু দরকার হলে): বাদ পড়া শব্দ ধরা — আলাদা পদ্ধতিতে শব্দ তালিকা, আর
    // এখনো Bijoy ফন্টে থাকা শব্দ
    let r2 = null;
    if (left.length || r1.failed.length || (mixed - mixedMap.size) > 0) {
      const ws = sel.getTextRanges([' '], true);
      ws.load('items/text,items/font/name,items/font/bold,items/font/italic,items/font/size,items/font/color,items/font/underline');
      await context.sync();
      const t2 = [], mixed2 = [];
      for (const w of ws.items) {
        if (!w.text || !w.text.trim()) continue;
        const fn = w.font.name || '';
        if (fn === '') { mixed2.push(w); continue; }
        const bijoyFont = fn !== '' && isBijoyFont(fn);
        if (!bijoyFont) continue; // শুধু সত্যিকারের Bijoy ফন্ট; বেছে নেওয়া ফন্টের লেখা কখনো ছোঁয়া হবে না
        const conv = convertBijoyToUnicode(w.text);
        if (conv !== w.text) t2.push({ range: w, orig: w.text, conv, fn, n: 1, fmt: { bold: w.font.bold, italic: w.font.italic, size: w.font.size } });
      }
      const mi2 = queueMixed(mixed2);
      if (mi2.length) { await context.sync(); finishMixed(mi2).forEach((arr) => arr.forEach((j) => t2.push(j))); }
      r2 = await applyJobs(context, t2, fontName);
      left = await leftoverParas();
    }

    sel.untrack();

    const failed = r1.failed.concat(r2 ? r2.failed : []);
    const leftTokens = [];
    left.forEach((t) => t.split(/\s+/).forEach((x) => { if (GLYPH.test(x) && leftTokens.length < 6) leftTokens.push(x); }));

    setStatus(r1.converted + 'টি অংশ (প্রায় ' + r1.words + 'টি শব্দ) কনভার্ট হয়েছে।' +
      (r2 && r2.converted ? ' বাদ পড়া ' + r2.converted + 'টি শব্দ দ্বিতীয় ধাপে ঠিক হয়েছে।' : '') +
      (r1.healed ? ' (' + r1.healed + 'টি দ্বিতীয়বার চেষ্টায়)' : '') +
      (skipped ? ' বাদ (অন্য ফন্ট): ' + Object.entries(skipFonts).map(([f, c]) => f + ' ×' + c).join(', ') + '।' : '') +
      (mixed - mixedMap.size > 0 ? ' মিশ্র ফন্টের ' + (mixed - mixedMap.size) + 'টি শব্দ পুরোপুরি ধরা যায়নি, যেমন: ' + mixedSamples.join(' , ') + '।' : '') +
      (failed.length ? ' ⚠ বদলানো যায়নি: ' + failed.slice(0, 5).join(' | ') : '') +
      (left.length ? ' ⚠ এখনো ' + left.length + 'টি অনুচ্ছেদে Bijoy অক্ষর আছে: ' + leftTokens.join(' , ') : ''),
      (failed.length || left.length) ? 'err' : 'ok');
  }).catch((err) => setStatus('সমস্যা হয়েছে: ' + err.message, 'err'))
    .finally(() => { btn.disabled = false; });
});
</script>
</body>
</html>
